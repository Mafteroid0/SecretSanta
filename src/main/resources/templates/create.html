<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая игра — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/games"><span class="brand-mark">S</span>Secret Santa</a>
        <div class="nav-links">
            <a class="nav-link active" href="/games">Игры</a>
            <a class="nav-link" href="/profile">Профиль</a>
            <a class="nav-link" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<main class="page page-narrow">
    <section class="panel">
        <h1 class="h2">Новая игра</h1>
        <p class="muted">Укажите название и срок подготовки подарков.</p>
        <form class="form-stack" id="createEventForm">
            <div class="field">
                <label for="eventName">Название</label>
                <input class="form-control" id="eventName" name="name" type="text" maxlength="200" required>
            </div>
            <div class="field">
                <label for="eventDeadline">Дедлайн</label>
                <input class="form-control" id="eventDeadline" name="deadline" type="datetime-local" required>
            </div>
            <div class="error" id="createEventError" aria-live="polite"></div>
            <button class="btn btn-primary full-width" type="submit">Создать игру</button>
        </form>
    </section>
</main>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/create-event.js"></script>
</body>
</html>
