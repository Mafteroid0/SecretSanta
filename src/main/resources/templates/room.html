<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Комната — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/games"><span class="brand-mark">S</span>Secret Santa</a>
        <div class="nav-links">
            <a class="nav-link active" href="/games">Игры</a>
            <a class="nav-link" href="/profile">Профиль</a>
            <a class="nav-link" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<main class="container page">
    <div class="room-grid">
        <section class="panel">
            <p class="eyebrow" id="roomStatus"></p>
            <h1 class="h2" id="roomName">Загрузка…</h1>
            <p class="muted">Дедлайн: <span id="roomDeadline">—</span></p>
            <div id="waitingForStart" class="muted">Ожидаем запуска жеребьёвки.</div>
            <div id="assignmentCard" class="panel assignment hidden">
                Вы дарите подарок: <strong><a id="giftedUserLink" href="#"><span id="giftedUserName"></span></a></strong>
            </div>
            <div class="error mt-3" id="roomError" aria-live="polite"></div>
            <h2 class="h5 mt-4">Участники</h2>
            <div class="participants-list" id="participantsList"></div>
        </section>
        <aside class="panel">
            <h2 class="h5">Управление</h2>
            <div class="form-stack mt-3">
                <button class="btn btn-ghost full-width" id="copyInviteButton" type="button">Скопировать приглашение</button>
                <button class="btn btn-primary full-width hidden" id="startGameButton" type="button">Начать игру</button>
                <button class="btn btn-danger-soft full-width hidden" id="gameActionButton" type="button"></button>
            </div>
        </aside>
    </div>
</main>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/room.js"></script>
</body>
</html>
