<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Приглашение — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/games"><span class="brand-mark">S</span>Secret Santa</a>
        <div class="nav-links">
            <a class="nav-link" href="/games">Игры</a>
            <a class="nav-link" href="/profile">Профиль</a>
            <a class="nav-link" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<main class="page page-narrow">
    <section class="panel">
        <p class="eyebrow">Вас пригласили</p>
        <h1 class="h2">Присоединиться к игре</h1>
        <div id="joinGameLoading" class="muted">Загружаем информацию…</div>
        <div id="joinGameContent" class="hidden">
            <div class="meta-row"><span class="muted">Игра</span><strong id="joinGameName"></strong></div>
            <div class="meta-row"><span class="muted">Дедлайн</span><strong id="joinGameDeadline"></strong></div>
            <button class="btn btn-primary full-width mt-4" id="joinGameButton" type="button">Присоединиться</button>
        </div>
        <div class="alert alert-danger hidden mt-3" id="joinGameError" role="alert"></div>
    </section>
</main>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/join.js"></script>
</body>
</html>
