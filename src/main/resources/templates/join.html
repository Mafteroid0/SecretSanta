<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <title>Join game</title>

    <link rel="stylesheet"
          href="/assets/bootstrap/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&amp;display=swap">
</head>

<body>

<nav class="navbar navbar-expand-md sticky-top py-3 navbar-dark"
     id="mainNav">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           href="/">

            <span class="bs-icon-sm bs-icon-circle bs-icon-primary shadow d-flex justify-content-center align-items-center me-2 bs-icon"></span>

            <span>
                <strong>Secret santa</strong>
            </span>

        </a>

        <button
                data-bs-toggle="collapse"
                class="navbar-toggler"
                data-bs-target="#navcol-1">

            <span class="visually-hidden">
                Toggle navigation
            </span>

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navcol-1">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="/home">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/games">
                        Games
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/profile">
                        Profile
                    </a>
                </li>

            </ul>

            <a class="btn btn-primary text-bg-danger shadow"
               role="button"
               href="/logout">
                Log out
            </a>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h1 class="fw-bold">
                            You've been invited!
                        </h1>

                        <p class="text-muted mb-0">
                            Join this Secret Santa game
                        </p>

                    </div>


                    <div id="joinGameContent"
                         class="d-none">

                        <div class="mb-3">

                            <span class="text-muted">
                                Game:
                            </span>

                            <strong id="joinGameName"></strong>

                        </div>


                        <div class="mb-4">

                            <span class="text-muted">
                                Deadline:
                            </span>

                            <strong id="joinGameDeadline"></strong>

                        </div>


                        <button
                                id="joinGameButton"
                                class="btn btn-primary w-100"
                                type="button">

                            Join game

                        </button>

                    </div>


                    <div id="joinGameLoading"
                         class="text-center text-muted">

                        Loading game...

                    </div>


                    <div id="joinGameError"
                         class="alert alert-danger d-none mt-3"
                         role="alert">
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="/assets/bootstrap/js/bootstrap.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/bold-and-dark.js"></script>
<script src="/assets/js/join.js"></script>

</body>

</html>
