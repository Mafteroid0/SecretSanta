<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/"><span class="brand-mark">S</span>Secret Santa</a>
        <a class="btn btn-ghost" href="/register">Регистрация</a>
    </div>
</nav>
<main class="page page-narrow">
    <section class="panel">
        <h1 class="h2">Вход</h1>
        <p class="muted">Продолжите подготовку к обмену подарками.</p>
        <form class="form-stack" method="post" data-auth-form>
            <div class="field">
                <label for="username">Логин</label>
                <input class="form-control" id="username" name="username" type="text" minlength="3" maxlength="50" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary full-width" type="submit">Войти</button>
            <div class="form-notice" data-form-notice aria-live="polite" th:text="${param.error != null ? 'Неверный логин или пароль.' : ''}"></div>
        </form>
    </section>
</main>
<script src="/assets/js/auth.js"></script>
</body>
</html>
