<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои игры — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/games"><span class="brand-mark">S</span>Secret Santa</a>
        <div class="nav-links">
            <a class="nav-link active" href="/games">Игры</a>
            <a class="nav-link" href="/profile">Профиль</a>
            <a class="nav-link" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<main class="container page">
    <div class="page-heading">
        <div>
            <h1 class="h2">Мои игры</h1>
            <p class="muted mb-0">Создайте новую игру или присоединитесь по приглашению.</p>
        </div>
        <div class="actions">
            <button class="btn btn-ghost" type="button" data-dialog-open="joinEventDialog">Присоединиться</button>
            <a class="btn btn-primary" href="/create">Создать игру</a>
        </div>
    </div>
    <div id="gamesList" class="games-list" aria-live="polite"></div>
</main>
<dialog class="app-dialog" id="joinEventDialog">
    <form class="dialog-body" id="joinEventForm">
        <div class="dialog-heading">
            <h2>Присоединиться к игре</h2>
            <button class="btn btn-ghost" type="button" data-dialog-close>Закрыть</button>
        </div>
        <div class="field">
            <label for="joinEventId">Ссылка или ID игры</label>
            <input class="form-control" id="joinEventId" type="text" autocomplete="off" required>
            <div class="error" id="joinGameError" aria-live="polite"></div>
        </div>
        <div class="dialog-actions">
            <button class="btn btn-primary" id="joinGameButton" type="submit">Присоединиться</button>
        </div>
    </form>
</dialog>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/games.js"></script>
</body>
</html>
