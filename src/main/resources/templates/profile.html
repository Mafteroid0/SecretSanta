<!DOCTYPE html>
<html data-bs-theme="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль — Secret Santa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="app-nav">
    <div class="container app-nav-inner">
        <a class="brand" href="/games"><span class="brand-mark">S</span>Secret Santa</a>
        <div class="nav-links">
            <a class="nav-link" href="/games">Игры</a>
            <a class="nav-link active" href="/profile">Профиль</a>
            <a class="nav-link" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<main class="container page">
    <div class="profile-grid">
        <section class="panel">
            <p class="eyebrow">Профиль</p>
            <h1 class="h3" th:text="${user.username}">Пользователь</h1>
            <h2 id="profileDisplayName" th:text="${user.displayName}">Иван Иванов</h2>
            <form class="form-stack mt-4 hidden" id="profileEditForm">
                <div class="field">
                    <label for="displayNameInput">Изменить отображаемое имя</label>
                    <input class="form-control" id="displayNameInput" name="displayName" type="text" th:value="${user.displayName != null ? user.displayName : 'Имя'}" maxlength="100" required>
                    <div id="profileEditError"></div>
                </div>
                <button class="btn btn-primary full-width" type="submit">Сохранить</button>
            </form>
        </section>
        <section class="panel">
            <div class="page-heading">
                <div>
                    <h2 class="h3">Вишлист</h2>
                    <p class="muted mb-0">Пожелания для будущего подарка.</p>
                </div>
                <div class="actions">
                    <button class="btn btn-ghost hidden" id="importWishlistButton" type="button" data-dialog-open="importWishlistModal">Импортировать</button>
                    <button class="btn btn-primary hidden" id="addWishButton" type="button" data-dialog-open="addWishlistItemModal">Добавить</button>
                </div>
            </div>
            <div id="wishlistNotice"></div>
            <div class="wishlist-list" id="wishlist" aria-live="polite"></div>
        </section>
    </div>
</main>
<dialog class="app-dialog" id="addWishlistItemModal">
    <form class="dialog-body" id="addWishlistItemForm">
        <div class="dialog-heading">
            <h2>Новое желание</h2>
            <button class="btn btn-ghost" type="button" data-dialog-close>Закрыть</button>
        </div>
        <div class="field">
            <label for="wishlistItemName">Название</label>
            <input class="form-control" id="wishlistItemName" type="text" maxlength="200" required>
        </div>
        <div class="field">
            <label for="wishlistItemDescription">Описание</label>
            <textarea class="form-control" id="wishlistItemDescription" maxlength="2000"></textarea>
        </div>
        <div class="error" id="wishlistError" aria-live="polite"></div>
        <div class="dialog-actions"><button class="btn btn-primary" type="submit">Добавить</button></div>
    </form>
</dialog>
<dialog class="app-dialog" id="importWishlistModal">
    <form class="dialog-body" id="importWishlistForm">
        <div class="dialog-heading">
            <h2>Импорт вишлиста</h2>
            <button class="btn btn-ghost" type="button" data-dialog-close>Закрыть</button>
        </div>
        <div class="field">
            <label for="importWishlistUrl">Публичная ссылка</label>
            <input class="form-control" id="importWishlistUrl" type="url" autocomplete="url" required>
            <span class="form-hint">Вставьте ссылку с поддерживаемого сервиса.</span>
        </div>
        <div class="error" id="importWishlistError" aria-live="polite"></div>
        <div class="dialog-actions"><button class="btn btn-primary" id="importWishlistSubmit" type="submit">Импортировать</button></div>
    </form>
</dialog>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/profile.js"></script>
</body>
</html>
