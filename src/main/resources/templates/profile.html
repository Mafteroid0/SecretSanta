<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Profile</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&amp;display=swap">
</head>

<body>
<nav class="navbar navbar-expand-md sticky-top py-3 navbar-dark" id="mainNav">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="bs-icon-sm bs-icon-circle bs-icon-primary shadow d-flex justify-content-center align-items-center me-2 bs-icon"></span>
            <span>Secret santa</span>
        </a>

        <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1">
            <span class="visually-hidden">Toggle navigation</span>
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navcol-1">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/games">Games</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link border rounded-pill" href="/profile">Profile</a>
                </li>
            </ul>

            <a class="btn btn-primary text-bg-danger shadow"
               role="button"
               href="/logout">
                Log out
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card h-100">
                <div class="card-body text-center d-flex flex-column align-items-center">

                    <div class="bs-icon-xl bs-icon-circle bs-icon-primary shadow bs-icon my-4">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="1em"
                             height="1em"
                             fill="currentColor"
                             viewBox="0 0 16 16"
                             class="bi bi-person">

                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664z"></path>
                        </svg>
                    </div>

                    <h5 th:text="${user.username}">
                        Username
                    </h5>

                    <form method="post" class="w-100">
                        <div class="mb-3">
                            <input class="form-control"
                                   type="text"
                                   name="username"
                                   placeholder="Username">
                        </div>

                        <div class="mb-3">
                            <button class="btn btn-primary shadow d-block w-100"
                                    type="submit">
                                Save
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center gap-3 mb-3 flex-wrap">

                        <div>
                            <h2 class="h4 mb-1">Wishlist</h2>
                            <p class="text-muted mb-0">
                                Things you would like to receive
                            </p>
                        </div>

                        <div class="d-flex gap-2">

                            <button
                                    id="importWishlistButton"
                                    class="btn btn-outline-primary flex-shrink-0 d-none"
                                    type="button"
                                    data-bs-toggle="modal"
                                    data-bs-target="#importWishlistModal">

                                Import wishlist
                            </button>

                            <button
                                    id="addWishButton"
                                    class="btn btn-primary flex-shrink-0 d-none"
                                    type="button"
                                    data-bs-toggle="modal"
                                    data-bs-target="#addWishlistItemModal">

                                Add wish
                            </button>

                        </div>
                    </div>

                    <div id="wishlistNotice" class="mb-3"></div>

                    <div id="wishlist"></div>

                </div>
            </div>
        </div>

    </div>
</main>


<!-- ADD WISH MODAL -->

<div class="modal fade"
     id="addWishlistItemModal"
     tabindex="-1"
     aria-labelledby="addWishlistItemModalLabel"
     aria-hidden="true">

    <div class="modal-dialog">
        <div class="modal-content">

            <form id="addWishlistItemForm">

                <div class="modal-header">

                    <h5 class="modal-title"
                        id="addWishlistItemModalLabel">
                        Add wish
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label"
                               for="wishlistItemName">
                            Name
                        </label>

                        <input id="wishlistItemName"
                               class="form-control"
                               type="text"
                               maxlength="200"
                               placeholder="What do you want?"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"
                               for="wishlistItemDescription">
                            Description
                        </label>

                        <textarea id="wishlistItemDescription"
                                  class="form-control"
                                  rows="4"
                                  maxlength="2000"
                                  placeholder="Optional description"></textarea>
                    </div>

                    <div id="wishlistError"
                         class="text-danger">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-primary"
                            type="submit">
                        Add
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>


<!-- IMPORT WISHLIST MODAL -->

<div class="modal fade"
     id="importWishlistModal"
     tabindex="-1"
     aria-labelledby="importWishlistModalLabel"
     aria-hidden="true">

    <div class="modal-dialog">
        <div class="modal-content">

            <form id="importWishlistForm">

                <div class="modal-header">

                    <h5 class="modal-title"
                        id="importWishlistModalLabel">
                        Import wishlist
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label"
                               for="importWishlistUrl">
                            Wishlist URL
                        </label>

                        <input
                                id="importWishlistUrl"
                                class="form-control"
                                type="url"
                                placeholder="https://example.com/wishlist/..."
                                autocomplete="url"
                                required>

                        <div class="form-text">
                            Paste a public wishlist link from a supported service.
                        </div>

                    </div>

                    <div id="importWishlistError"
                         class="text-danger">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button id="importWishlistSubmit"
                            class="btn btn-primary"
                            type="submit">
                        Import
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>


<script src="/assets/bootstrap/js/bootstrap.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/bold-and-dark.js"></script>
<script src="/assets/js/profile.js"></script>
</body>

</html>
